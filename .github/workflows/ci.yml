name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  pins:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.pins.outputs.rust }}
      msrv: ${{ steps.pins.outputs.msrv }}
    steps:
      - name: Prepare source declarations
        id: prepare
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
        with:
          python-version: '3.15.2'
      - id: pins
        run: python tools/ci_pins.py
      - name: Complete source declarations
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.prepare.outcome == 'failure' && 'success' || job.status }}
          task: compiler-declarations
          name: compiler-declarations
          read-token: ${{ steps.prepare.outputs.read-token }}
  rust:
    needs: pins
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    with:
      hosted-runner: ubuntu-24.04
      recipe: ci-rust
      rust-version: ${{ needs.pins.outputs.rust }}
      rust-components: rustfmt,clippy
      python-version: '3.15.2'
      tools: just@1.59.0
      timeout-minutes: 30
  supply-chain:
    needs: pins
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    with:
      hosted-runner: ubuntu-24.04
      recipe: ci-supply
      rust-version: ${{ needs.pins.outputs.rust }}
      tools: just@1.59.0,cargo-deny@0.20.2,cargo-machete@0.9.2
      tool-assets: .github/ci/supply-tools.json
      timeout-minutes: 15
  boundary:
    needs: pins
    name: boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The original Windows import-table gap remains explicit.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This SDK-only path restores no project build cache.
      - name: Prepare the compiler without restoring built provider bytes
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
        with:
          managed: 'false'
          rust-version: ${{ needs.pins.outputs.rust }}
          python-version: '3.15.2'
          tools: just@1.59.0
      - run: just ci-boundary
      - name: Record the actual boundary result
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/job-record@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
        with:
          task: native-boundary
          status: ${{ job.status }}
  platforms:
    needs: pins
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    with:
      hosted-runner: ${{ matrix.os }}
      recipe: ci-test
      rust-version: ${{ needs.pins.outputs.rust }}
      python-version: '3.15.2'
      tools: just@1.59.0
      timeout-minutes: 40
  msrv:
    needs: pins
    if: ${{ github.event_name != 'pull_request' }}
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    with:
      hosted-runner: ubuntu-24.04
      recipe: ci-msrv
      rust-version: ${{ needs.pins.outputs.msrv }}
      python-version: '3.15.2'
      tools: just@1.59.0
      timeout-minutes: 20
  workflows:
    needs: pins
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    with:
      hosted-runner: ubuntu-24.04
      recipe: check
      arguments: ${{ github.event_name == 'pull_request' && format('["{0}","{1}"]', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '[]' }}
      fetch-depth: 0
      rust-version: ${{ needs.pins.outputs.rust }}
      rust-components: rustfmt
      python-version: '3.15.2'
      tools: just@1.59.0,zizmor@1.32.0
      tool-assets: .github/ci/source-tools.json
      timeout-minutes: 10
  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    with:
      hosted-runner: ubuntu-24.04
  gate:
    if: always()
    needs: [pins, rust, supply-chain, boundary, platforms, msrv, workflows, merge-stops]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require each real platform and policy verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: >-
            {"pins":"success","rust":"success","supply-chain":"success","boundary":"success","platforms":"${{ github.event_name == 'pull_request' && 'skipped' || 'success' }}","msrv":"${{ github.event_name == 'pull_request' && 'skipped' || 'success' }}","workflows":"success","merge-stops":"${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}"}
        run: jq -e --argjson want "$EXPECTED" 'map_values(.result) == $want' <<< "$NEEDS"
      - name: Record the actual aggregate result
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/job-record@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
        with:
          task: native-quality
          status: ${{ job.status }}
